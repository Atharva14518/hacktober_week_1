[project]
name = "wildquest"
version = "0.1.0"
description = "Offline, voice-only AI game master for real-world hikes"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "birdnet==1.1.1",
  "fastapi==0.142.2",
  "kokoro-onnx==0.6.1",
  "pillow==12.3.0",
  "piper-tts==1.8.0",
  "pydantic==2.13.5",
  "python-multipart==0.0.32",
  "pyyaml==6.0.3",
  "soundfile==0.13.1",
  "uvicorn==0.53.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wildquest"]

[dependency-groups]
dev = [
  "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
